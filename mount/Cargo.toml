[package]
name = "ys-vhdx-mount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "RPL-1.5"
repository = "https://github.com/Yamato-Security/ys-vhdx-parser"
authors = ["Yamato Security"]
description = "Read-only VHDX NTFS mounting through FUSE, used by Juntei"
readme = "README.md"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
vhdx = { package = "ys-vhdx-parser", version = "1.0.0", path = "../core" }
ntfs-core = "0.9.8"
fuser = "0.18"
ctrlc = { version = "3.5.2", features = ["termination"] }

[dev-dependencies]
flate2 = "1.1.11"
sha2 = "0.11.1"
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
